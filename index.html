<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="سيرة ذاتية ديناميكية احترافية - Dynamic CV" />
  <meta name="author" content="محمد عبدالله العتيبي" />
  <meta name="theme-color" content="#0078d7" />
  <title>CV — Mohammed</title>
  
  <!-- Preload Critical Resources -->
  <link rel="preload" as="style" href="styles.css" />
  <link rel="preload" as="script" href="data.js" />
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
  
  <!-- Font Awesome - Lazy Load -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'" />
<link rel="icon" href="/images/profile.JPG" />
<body>
  <!-- Fallback for JavaScript disabled -->
  <noscript>
    <div style="padding: 20px; text-align: center; font-family: Arial, sans-serif;">
      <p>JavaScript مطلوب لعرض السيرة الذاتية | JavaScript is required to display the CV</p>
    </div>
  </noscript>

  <div class="controls">
    <div class="control-group">
      <button onclick="setLanguage('ar')" class="lang-btn">🇸🇦 العربية</button>
      <button onclick="setLanguage('en')" class="lang-btn">🇬🇧 English</button>
      <button onclick="toggleTheme()" class="theme-btn">🌞 / 🌙</button>
    </div>
    <div class="control-group">
      <button onclick="downloadPDF()" class="pdf-btn"><i class="fas fa-download"></i> <span id="pdfLabel">PDF</span></button>
      <button onclick="toggleSearch()" class="search-btn"><i class="fas fa-search"></i></button>
    </div>
  </div>

  <div id="searchBar" class="search-bar hidden">
    <input type="text" id="searchInput" placeholder="ابحث عن مهارة أو خبرة..." onkeyup="debouncedFilter()" />
  </div>

  <main class="container">
    <header>
      <div class="header-content">
        <div class="profile-image-wrapper">
          <img id="profileImage" src="/images/profile.JPG" alt="محمد عبدالله العتيبي" class="profile-image" loading="lazy" />
        </div>
        <div class="header-text">
          <h1 id="name">جاري التحميل...</h1>
          <p id="title"></p>
          <p id="location"></p>
          <ul id="contacts"></ul>
        </div>
      </div>
    </header>

    <section>
      <h2 id="summaryTitle"></h2>
      <p id="summary"></p>
    </section>

    <section id="skillsSection">
      <h2 id="skillsTitle"></h2>
      <div id="skills" class="skills-container"></div>
    </section>

    <section id="certificationsSection" class="hidden">
      <h2 id="certificationsTitle"></h2>
      <div id="certifications" class="certifications-container"></div>
    </section>

    <section id="educationSection">
      <h2 id="educationTitle"></h2>
      <div id="education"></div>
    </section>

    <section id="experienceSection">
      <h2 id="experienceTitle"></h2>
      <div id="experience"></div>
    </section>

    <section>
      <h2 id="languagesTitle"></h2>
      <ul id="languages"></ul>
    </section>

    <footer style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px;">
      <p>© 2024 محمد عبدالله العتيبي | تم إنشاؤها باستخدام CV Generator</p>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>
